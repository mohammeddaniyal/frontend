<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .boxes {
            border: 2px dashed grey;
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            height: 200px;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;

        }

        .box-relative {
            position: relative;
            top: 100px;

        }

        .box-absolute {
            position: absolute;
            top: 100px;
            left: 120px;
        }

        .absolute .boxes {
            position: relative;
        }
    </style>
</head>

<body>
    <section class="relative">
        <h2>Relative </h2>
        <div class="boxes">
            <div class="box">Box 1</div>
            <div class="box box-relative">Box 2</div>
            <div class="box">Box 3</div>
        </div>
    </section>
    <section class="absolute">
        <h2>Absolute</h2>
        <div class="boxes">
            <div class="box">Box 1</div>
            <div class="box box-absolute">Box 2</div>
            <div class="box">Box 3 </div>
        </div>
    </section>

</body>

</html>
