<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Positioning</title>
    <style>
        .course-card {
            background-color: lightblue;
            padding: 30px;
            width: 300px;

            position: relative;
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;

            background-color: crimson;
            color: white;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <div class="course-card">
        <span class="badge">NEW</span>

        <h2>Java Programming</h2>
        <p>Learn Java fundamentals and OOP.</p>
    </div>

</body>

</html>
