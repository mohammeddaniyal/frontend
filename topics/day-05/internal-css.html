
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>

    <style>
        h1 {
            color: blue;
        }

        p {
            color: gray;
        }

        .description {
            font-size: 20px;
            font-weight: bold;
        }

        div {
            background-color: lightgray;
        }

        h2 {
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>

    <h1>CSS Basics</h1>

    <p>
        This paragraph is styled using internal CSS.
    </p>

    <p class="description">
        CSS can change the appearance of HTML elements.
    </p>

    <div>
        This is a styled div.
    </div>

    <h2>Experiment With CSS</h2>

</body>
</html>
