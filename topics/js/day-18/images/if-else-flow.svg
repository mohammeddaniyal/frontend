<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
<rect width="900" height="390" rx="20" fill="#f4f7fb"/>
<text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#182334">How if-else makes a decision</text>
<path d="M450 75 L560 140 L450 205 L340 140 Z" fill="#fff0d9" stroke="#d68a24" stroke-width="3"/>
<text x="450" y="146" text-anchor="middle" font-family="Arial" font-size="20" fill="#80500f">Condition?</text>
<path d="M340 140 H190 V225 M560 140 H710 V225" fill="none" stroke="#526579" stroke-width="3"/>
<path d="M182 215 L190 229 L198 215 M702 215 L710 229 L718 215" fill="none" stroke="#526579" stroke-width="3"/>
<text x="250" y="125" font-family="Arial" font-size="17" fill="#1e7a48">true</text>
<text x="640" y="125" font-family="Arial" font-size="17" fill="#a65d13">false</text>
<rect x="75" y="230" width="230" height="90" rx="14" fill="#e2f5e9" stroke="#39945d" stroke-width="3"/>
<text x="190" y="268" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#1e5d37">if block</text>
<text x="190" y="294" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e5d37">Runs when true</text>
<rect x="595" y="230" width="230" height="90" rx="14" fill="#ffe9e4" stroke="#c66b55" stroke-width="3"/>
<text x="710" y="268" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#843e31">else block</text>
<text x="710" y="294" text-anchor="middle" font-family="Arial" font-size="15" fill="#843e31">Runs when false</text>
<text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Only one branch is selected.</text>
</svg>