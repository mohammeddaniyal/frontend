<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" rx="22" fill="#f4f7fb"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#182334">The same variable can hold different types over time</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="105" width="245" height="145" rx="16" fill="#dceafe" stroke="#3778c2" stroke-width="3"/><text x="177" y="140" font-size="18" fill="#183b65">Step 1</text><text x="177" y="180" font-size="27" font-weight="bold" fill="#183b65">value = 100</text><text x="177" y="218" font-size="18" fill="#183b65">Number</text><path d="M315 177 H350 M340 165 L352 177 L340 189" stroke="#526579" stroke-width="4" fill="none"/><rect x="375" y="105" width="245" height="145" rx="16" fill="#fff0d9" stroke="#d68a24" stroke-width="3"/><text x="497" y="140" font-size="18" fill="#80500f">Step 2</text><text x="497" y="180" font-size="27" font-weight="bold" fill="#80500f">value = "Hello"</text><text x="497" y="218" font-size="18" fill="#80500f">String</text><path d="M635 177 H670 M660 165 L672 177 L660 189" stroke="#526579" stroke-width="4" fill="none"/><rect x="695" y="105" width="245" height="145" rx="16" fill="#e2f5e9" stroke="#39945d" stroke-width="3"/><text x="817" y="140" font-size="18" fill="#1e5d37">Step 3</text><text x="817" y="180" font-size="27" font-weight="bold" fill="#1e5d37">value = true</text><text x="817" y="218" font-size="18" fill="#1e5d37">Boolean</text></g><text x="500" y="292" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">The variable name stays the same; the current value and type change.</text></svg>