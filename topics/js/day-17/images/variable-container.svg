<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="22" fill="#f4f7fb"/><text x="450" y="48" font-family="Arial" font-size="26" text-anchor="middle" fill="#182334" font-weight="bold">A variable is a named container for a value</text><rect x="90" y="105" width="310" height="125" rx="16" fill="#dceafe" stroke="#3778c2" stroke-width="3"/><text x="245" y="145" text-anchor="middle" font-family="Arial" font-size="19" fill="#183b65">Variable name</text><text x="245" y="190" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#183b65">age</text><path d="M420 167 H480 M468 155 L482 167 L468 179" stroke="#526579" stroke-width="4" fill="none"/><rect x="500" y="105" width="310" height="125" rx="16" fill="#e2f5e9" stroke="#39945d" stroke-width="3"/><text x="655" y="145" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e5d37">Stored value</text><text x="655" y="190" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#1e5d37">20</text><text x="450" y="270" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">let age = 20;</text></svg>