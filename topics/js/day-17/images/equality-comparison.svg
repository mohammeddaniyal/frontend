<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="22" fill="#f4f7fb"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#182334">Loose equality vs strict equality</text><rect x="65" y="90" width="400" height="210" rx="18" fill="#fff0d9" stroke="#d68a24" stroke-width="3"/><text x="265" y="130" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#80500f">==</text><text x="265" y="175" text-anchor="middle" font-family="Arial" font-size="22" fill="#80500f">10 == "10"</text><text x="265" y="225" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#80500f">true</text><text x="265" y="265" text-anchor="middle" font-family="Arial" font-size="17" fill="#80500f">Allows type coercion</text><rect x="535" y="90" width="400" height="210" rx="18" fill="#e2f5e9" stroke="#39945d" stroke-width="3"/><text x="735" y="130" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1e5d37">===</text><text x="735" y="175" text-anchor="middle" font-family="Arial" font-size="22" fill="#1e5d37">10 === "10"</text><text x="735" y="225" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1e5d37">false</text><text x="735" y="265" text-anchor="middle" font-family="Arial" font-size="17" fill="#1e5d37">Checks value and type</text><text x="500" y="335" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">Prefer strict equality (===) for predictable comparisons.</text></svg>