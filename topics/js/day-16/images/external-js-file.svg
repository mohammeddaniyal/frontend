<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><rect width="1000" height="300" rx="20" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Connecting an external JavaScript file</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="85" width="350" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="4"/><text x="245" y="135" font-size="27" font-weight="bold" fill="#1d4ed8">index.html</text><text x="245" y="175" font-size="19" fill="#334155">&lt;script src="script.js"&gt;</text><rect x="580" y="85" width="350" height="130" rx="14" fill="white" stroke="#ca8a04" stroke-width="4"/><text x="755" y="135" font-size="27" font-weight="bold" fill="#a16207">script.js</text><text x="755" y="175" font-size="19" fill="#334155">console.log("Hello!");</text><path d="M435 150 H565 M550 135 L565 150 L550 165" stroke="#475569" stroke-width="4" fill="none"/><text x="500" y="260" font-size="18" fill="#475569">The src attribute tells the browser which JavaScript file to load.</text></g></svg>