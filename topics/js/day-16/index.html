<!DOCTYPE html>
<html>
<head>
    <title>Bulb ON/OFF</title>
</head>
<body>

    <h2>JavaScript Can Change HTML Attributes</h2>

    <img
        id="bulb"
        src="images/bulb-off.jpg"
        alt="Bulb turned off"
        width="150"
    >

    <button onclick="turnOn()">Turn ON</button>
    <button onclick="turnOff()">Turn OFF</button>

    <script src="script.js"></script>
</body>
</html>
