<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block, Inline and Normal Flow</title>

    <style>

        .block {
            width: 200px;
            height: 50px;
            background-color: lightgray;
            margin: 5px;
        }

        .inline {
            background-color: lightblue;
        }

        .inline-block {
            display: inline-block;

            width: 150px;
            height: 50px;

            background-color: lightgreen;

            margin: 5px;
        }

    </style>
</head>

<body>

    <h1>Block, Inline and Normal Flow</h1>

    <h2>Block Elements</h2>

    <div class="block">Box 1</div>
    <div class="block">Box 2</div>
    <div class="block">Box 3</div>


    <h2>Inline Elements</h2>

    <span class="inline">Item 1</span>
    <span class="inline">Item 2</span>
    <span class="inline">Item 3</span>


    <h2>Inline-Block Elements</h2>

    <span class="inline-block">Item 1</span>
    <span class="inline-block">Item 2</span>
    <span class="inline-block">Item 3</span>

</body>

</html>
