<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cascade and Specificity</title>

    <style>


p {
    color: blue;
}

.text {
    color: red;
}

#message {
    color: green;
}
.parent {
    color: blue;
}



    </style>

</head>

<body>
<p id="message" class="text" style="color: orange;">
    Which color will I be?
</p>

<div class="parent">

    <h2>My Profile</h2>

    <p>This is my profile description.</p>

</div>

    
</body>

</html>
