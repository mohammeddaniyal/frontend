
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 — Forms</title>
</head>
<body>

    <h1>HTML Forms</h1>

    <!--
        Problem:
        Our page can display information,
        but how can a visitor give us information?
    -->

    <!-- Solution: Create a form -->

    <form>

        <!--
            Problem:
            We need to collect the visitor's name.
        -->

        <fieldset>

            <legend>Contact Information</legend>

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <!--
                Problem:
                We also need an email address.
            -->

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <!--
                Problem:
                A visitor may need to write a longer message.
            -->

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Write your message"
                rows="5"
                required
            ></textarea>

            <!--
                Problem:
                We need a way to submit the form.
            -->

            <button type="submit">Send Message</button>

        </fieldset>

    </form>


    <!--
        Additional useful attributes

        minlength → minimum number of characters
        maxlength → maximum number of characters
        pattern   → expected format using a regular expression
    -->

    <h2>Example of pattern</h2>

    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        name="username"
        pattern="[A-Za-z0-9]+"
    >


    <!--
        Remember:

        id   → identifies the HTML element
        name → identifies the form data
        for  → connects a label to an input's id

        required  → value must be provided
        minlength → minimum characters
        maxlength → maximum characters
        pattern   → expected format

        fieldset → groups related form controls
        legend   → names that group

        placeholder → hint shown inside an empty control

        rows → controls the visible height of a textarea
    -->

</body>
</html>
